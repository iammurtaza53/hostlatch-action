name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
      - run: npm run lint
      - run: npm test
      - name: Exercise the action
        uses: ./
        with:
          base: origin/main
          fail-on: never
          output: .hostlatch/manifest-${{ runner.os }}.json
      - name: Validate the manifest
        shell: bash
        run: node -e "const fs=require('node:fs'); const value=JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); if (value.schemaVersion !== 1 || !value.manifestId) process.exit(1);" ".hostlatch/manifest-${{ runner.os }}.json"
